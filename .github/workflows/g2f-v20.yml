name: g2f-v20-stage1-reml-gblup

on:
  push:
    branches:
      - tmp-g2f-v20-remL

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install scientific stack
        run: python -m pip install --upgrade pip && pip install numpy pandas scipy statsmodels pyarrow
      - name: Run stage-one BLUE/BLUP and temporal REML-GBLUP
        run: python g2f_v20_analysis.py
      - name: Upload result tables and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2f-v20-results
          path: results_v20/
          if-no-files-found: warn
          retention-days: 3
